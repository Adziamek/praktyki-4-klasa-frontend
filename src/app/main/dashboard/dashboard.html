<div class="d-flex justify-content-center align-items-center" style="height: 25vh;">
    @if (username) {
        <h2 class="alert alert-info" id="message">Hi, {{ username }}.</h2>
    } @else {
        <h2 class="alert alert-info" id="message">Please log in to continue.</h2>
    }
    
</div>

<div class="d-flex justify-content-center align-items-center">
    <p>Liczba produktów: {{ products.length }}</p>

    @for (product of products; track product.id) {
    <p>
        ID: {{ product.id }} |
        Nazwa: {{ product.name }} |
        EAN: {{ product.ean }}
    </p>
    }

</div>
