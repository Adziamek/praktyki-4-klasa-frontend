<div class="d-flex justify-content-center align-items-center" style="height: 25vh;">
  @if (username) {
  <h2 class="alert alert-info" id="message">Hi, {{ username }}.</h2>
  } @else {
  <h2 class="alert alert-info" id="message">Please log in to continue.</h2>
  }
</div>

<div class="mx-5">
    <h2>Summary:</h2>
    <ul class="list-group list-group-flush">
        <li class="list-group-item">Amount of products: {{ productsCount }}</li>
        <li class="list-group-item">Amount of locations: {{ locationsCount }}</li>
    </ul>

    @if (errorMessage) {
    <div class="alert alert-danger">{{ errorMessage }}</div>
    }

</div>
