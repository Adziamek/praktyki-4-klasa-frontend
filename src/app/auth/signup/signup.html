<div class="auth-shell">
    <form class="auth-form" (ngSubmit)="signup()">

        <h2 class="text-center mb-4">Create account</h2>

        <app-input-string 
            label="Username"
            id="username"
            name="username"
            [required]="true"
            [error]="usernameError()"
            [(ngModel)]="username"
        />

        <app-input-string 
            label="Password"
            id="password"
            name="password"
            type="password"
            [required]="true"
            [error]="passwordError()"
            [(ngModel)]="password"
        />

        <app-input-string 
            label="Email"
            id="email"
            name="email"
            type="email"
            [required]="true"
            [error]="emailError()"
            [(ngModel)]="email"
        />

        <div class="mb-3 auth-link-row">
            <p class="text-center mb-0"><a routerLink="/login">Already have an account?</a></p>
        </div>

        <app-info-error-box [infoMessage]="infoMessage()" [errorMessage]="errorMessage()" />

        <button type="submit" class="btn btn-primary w-100">
            Sign Up
        </button>

    </form>
</div>
