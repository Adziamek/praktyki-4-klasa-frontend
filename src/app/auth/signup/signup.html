<div class="d-flex justify-content-center align-items-center vh-100">
    <form class="w-100" style="max-width: 400px;" (ngSubmit)="signup()">

        <h2 class="text-center mb-4">Sign Up</h2>

        <app-input-string 
            label="Username"
            id="username"
            name="username"
            [error]="usernameError()"
            [(ngModel)]="username"
        />

        <app-input-string 
            label="Password"
            id="password"
            name="password"
            type="password"
            [error]="passwordError()"
            [(ngModel)]="password"
        />

        <app-input-string 
            label="Email"
            id="email"
            name="email"
            type="email"
            [error]="emailError()"
            [(ngModel)]="email"
        />

        <div class="mb-3">
            <p class="text-center"><a routerLink="/login">Log In</a></p>
        </div>

        <app-info-error-box [infoMessage]="infoMessage()" [errorMessage]="errorMessage()" />

        <button type="submit" class="btn btn-primary w-100">
            Sign Up
        </button>

    </form>
</div>
