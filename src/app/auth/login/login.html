<div class="d-flex justify-content-center align-items-center vh-100">
    <form class="w-100" style="max-width: 400px;" (ngSubmit)="login()">

        <h2 class="text-center mb-4">Login</h2>

        <app-input-string 
            label="Username"
            id="username"
            name="username"
            [required]="true"
            [type]="username"
            [(ngModel)]="username"
        />

        <app-input-string 
            label="Password"
            id="password"
            name="password"
            type="password"
            [required]="true"
            [(ngModel)]="password"
        />

        <div class="mb-3">
            <p class="text-center"><a routerLink="/signup">Sign Up</a></p>
        </div>

        <app-info-error-box [errorMessage]="errorMessage()" />


        <button type="submit" class="btn btn-primary w-100">
            Login
        </button>

    </form>
</div>
