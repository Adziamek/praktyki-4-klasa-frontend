<div class="auth-shell">
    <form class="auth-form" (ngSubmit)="login()">

        <h2 class="text-center mb-4">Welcome back</h2>

        <app-input-string 
            label="Username"
            id="username"
            name="username"
            [required]="true"
            [type]="username"
            [(ngModel)]="username"
        />

        <app-input-string 
            label="Password"
            id="password"
            name="password"
            type="password"
            [required]="true"
            [(ngModel)]="password"
        />

        <app-info-error-box [errorMessage]="errorMessage()" />

        <div class="mb-3 auth-link-row">
            <p class="text-center mb-0"><a routerLink="/signup">Create an account</a></p>
        </div>

        <button type="submit" class="btn btn-primary w-100">
            Login
        </button>

    </form>
</div>
