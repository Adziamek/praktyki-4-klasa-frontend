<div class="d-flex justify-content-center align-items-center mt-4">
  <form
    class="w-100"
    style="max-width: 400px;"
    (ngSubmit)="create()"
  >

    <h2 class="text-center mb-4">Add Product</h2>

    <app-input-string
        label="Name"
        id="name"
        name="name"
        [required]="true"
        [error]="nameError()"
        [(ngModel)]="name"
      />

    <app-input-string
      label="EAN"
      id="ean"
      name="ean"
      [required]="true"
      [error]="eanError()"
      [(ngModel)]="ean"
    />

    <app-input-select
      label="Category"
      id="categoryId"
      name="categoryId"
      placeholder="Select Category"
      [options]="categories"
      [value]="categoryId"
      (valueChange)="categoryId = $event"
      [error]="categoryIdError()"
      [required]="true"
    />

    <app-input-select
      label="Brand"
      id="brandId"
      name="brandId"
      placeholder="Select Brand"
      [options]="brands"
      [value]="brandId"
      (valueChange)="brandId = $event"
      [error]="brandIdError()"
      [required]="true"
    />


    <app-submit-button buttonText="Add Product" />

    <app-info-error-box [errorMessage]="errorMessage()" [infoMessage]="infoMessage()" />
  </form>
</div>
