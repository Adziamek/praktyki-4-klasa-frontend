<div class="d-flex justify-content-center align-items-center mt-4">
  <form
    class="w-100"
    style="max-width: 400px;"
    (ngSubmit)="create()"
  >

    <h2 class="text-center mb-4">Add Product</h2>

    <app-input-string
        label="Name" 
        id="name"
        name="name"
        [required]="true"
        [error]="nameError()"
        [(ngModel)]="name" 
      />

    <app-input-string
      label="EAN" 
      id="ean"
      name="ean"
      [required]="true"
      [error]="eanError()"
      [(ngModel)]="ean" 
    />

    <app-input-string
      type="number"
      label="Category ID" 
      id="categoryId"
      name="categoryId"
      [required]="true"
      [error]="categoryIdError()"
      [(ngModel)]="categoryId" 
    />

    <app-input-string
      type="number"
      label="Brand ID" 
      id="brandId"
      name="brandId"
      [required]="true"
      [error]="brandIdError()"
      [(ngModel)]="brandId" 
    />

    <app-submit-button buttonText="Add Product" />

    <app-info-error-box [errorMessage]="errorMessage()" [infoMessage]="infoMessage()" />
  </form>
</div>
