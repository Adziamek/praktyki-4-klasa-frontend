<div class="mb-3">
    <label [for]="id()" class="form-label">{{ label() }}</label>

    <input
        [type]="type()"
        class="form-control"
        [id]="id()"
        [name]="name()"
        [placeholder]="placeholder()"
        [value]="value()"
        (input)="valueChange.emit($any($event.target).value)"
        required
    >

    @if (error()) {
        <div class="text-danger">
            {{ error() }}
        </div>
    }
</div>
