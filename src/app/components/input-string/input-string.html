<div>
    <label [for]="id()" class="form-label">{{ label() }}</label>

    <input
        [type]="type()"
        class="form-control"
        [id]="id()"
        [name]="name()"
        [placeholder]="placeholder()"
        [value]="value()"
        (input)="onInput($event)"
        [required]="required()"
    >

    <div class="text-danger input-error">
      @if (error()) {
        {{ error() }}
      }
    </div>
</div>
