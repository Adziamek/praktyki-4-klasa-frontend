@if (toastService.notification(); as notification) {
  <div class="toast-container position-fixed top-0 end-0 p-3">
    <div
      class="toast show"
      role="alert"
      aria-live="assertive"
      aria-atomic="true"
    >
      <div class="toast-header">
        <strong class="me-auto">
          {{ notification.title }}
        </strong>

        <button
          type="button"
          class="btn-close ms-2"
          aria-label="Close"
          (click)="dismiss()"
        ></button>
      </div>

      <div class="toast-body">
        {{ notification.message }}
      </div>
    </div>
  </div>
}
