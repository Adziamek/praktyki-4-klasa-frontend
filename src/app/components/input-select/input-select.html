<div class="mb-3">
  <label [for]="id()" class="form-label">
    {{ label() }}
  </label>

  <select
    class="form-select"
    [id]="id()"
    [name]="name()"
    [value]="value()"
    (change)="onChange($event)"
    [required]="required()">

    <option value="" disabled>
      {{ placeholder() }}
    </option>

    @for (option of options(); track option.id) {
      <option [value]="option[valueKey()]">
        {{ option[labelKey()] }}
      </option>
    }
  </select>

  @if (error()) {
    <div class="text-danger">
      {{ error() }}
    </div>
  }
</div>
